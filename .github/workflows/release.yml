name: Release

on:
    push:
        branches:
            - master

permissions:
    contents: write

jobs:
    release:
        name: Publish GitHub Release
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check release intent
              id: version
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $beforeSha = "${{ github.event.before }}"
                  $currentPackageJson = Get-Content "package.json" -Raw | ConvertFrom-Json
                  $currentPluginJson = Get-Content "plugin.json" -Raw | ConvertFrom-Json
                  $currentVersion = $currentPackageJson.version
                  $pluginVersion = $currentPluginJson.Version
                  $previousVersion = ""

                  if ($currentVersion -ne $pluginVersion) {
                      throw "Version mismatch: package.json has $currentVersion but plugin.json has $pluginVersion"
                  }

                  if (-not [string]::IsNullOrWhiteSpace($beforeSha) -and $beforeSha -notmatch "^0+$") {
                      $previousPackageJson = git show "${beforeSha}:package.json" 2>$null

                      if ($LASTEXITCODE -eq 0 -and $previousPackageJson) {
                          $previousVersion = ($previousPackageJson | Out-String | ConvertFrom-Json).version
                      }
                  }

                  if ($previousVersion -eq $currentVersion) {
                      Write-Host "package.json version did not change. No release will be created."
                      "should_release=false" >> $env:GITHUB_OUTPUT
                      "release_version=$currentVersion" >> $env:GITHUB_OUTPUT
                      "tag_name=v$currentVersion" >> $env:GITHUB_OUTPUT
                      "zip_path=release/map-paste-v$currentVersion.zip" >> $env:GITHUB_OUTPUT
                      exit 0
                  }

                  $tagName = "v$currentVersion"
                  $existingTag = git ls-remote --tags origin $tagName

                  if ($existingTag) {
                      throw "Release tag already exists: $tagName"
                  }

                  Write-Host "Detected release version change: $previousVersion -> $currentVersion"

                  "should_release=true" >> $env:GITHUB_OUTPUT
                  "release_version=$currentVersion" >> $env:GITHUB_OUTPUT
                  "tag_name=$tagName" >> $env:GITHUB_OUTPUT
                  "zip_path=release/map-paste-v$currentVersion.zip" >> $env:GITHUB_OUTPUT

            - name: Set up Node.js
              if: steps.version.outputs.should_release == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              if: steps.version.outputs.should_release == 'true'
              run: npm ci

            - name: Run tests
              if: steps.version.outputs.should_release == 'true'
              run: npm test

            - name: Check formatting
              if: steps.version.outputs.should_release == 'true'
              run: npm run format:check

            - name: Build release package
              if: steps.version.outputs.should_release == 'true'
              shell: pwsh
              run: ./scripts/package-release.ps1

            - name: Verify release package
              if: steps.version.outputs.should_release == 'true'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $zipPath = "${{ steps.version.outputs.zip_path }}"

                  if (-not (Test-Path $zipPath)) {
                      throw "Release zip was not created: $zipPath"
                  }

                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath))

                  try {
                      $entries = $zip.Entries.FullName | ForEach-Object { $_ -replace "\\", "/" }

                      $requiredEntries = @(
                          "map-paste/plugin.json",
                          "map-paste/main.js",
                          "map-paste/src/constants.js",
                          "map-paste/Images/app.png",
                          "map-paste/SettingsTemplate.yaml",
                          "map-paste/README.md",
                          "map-paste/LICENSE",
                          "map-paste/package.json"
                      )

                      foreach ($entry in $requiredEntries) {
                          if ($entries -notcontains $entry) {
                              throw "Release zip is missing required entry: $entry"
                          }
                      }

                      $forbiddenPatterns = @(
                          "^map-paste/\.git/",
                          "^map-paste/node_modules/",
                          "^map-paste/test/",
                          "^map-paste/scripts/"
                      )

                      foreach ($pattern in $forbiddenPatterns) {
                          if ($entries | Where-Object { $_ -match $pattern }) {
                              throw "Release zip contains forbidden entry matching: $pattern"
                          }
                      }
                  }
                  finally {
                      $zip.Dispose()
                  }

            - name: Write release notes
              if: steps.version.outputs.should_release == 'true'
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"

                  $tagName = "${{ steps.version.outputs.tag_name }}"

                  $releaseNotes = @'
                  ## MapPaste {TAG}

                  MapPaste release {TAG}.

                  ### Features

                  - Search Google Maps from pasted text using the `mp` Flow Launcher keyword.
                  - Opens Google Maps in the default browser.
                  - Supports optional default location setting.
                  - Uses Google Maps URLs only.
                  - No Google Maps API key required.
                  - No backend and no telemetry.

                  ### Manual installation

                  1. Download `map-paste-{TAG}.zip`.
                  2. Extract the `map-paste` folder into `%APPDATA%\FlowLauncher\Plugins`.
                  3. Restart Flow Launcher.
                  4. Type `mp coffee near Barcelona`.
                  '@

                  $releaseNotes.Replace("{TAG}", $tagName) | Set-Content -Path release-notes.md -Encoding utf8

            - name: Publish release
              if: steps.version.outputs.should_release == 'true'
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $ErrorActionPreference = "Stop"

                  $tagName = "${{ steps.version.outputs.tag_name }}"
                  $zipPath = "${{ steps.version.outputs.zip_path }}"

                  if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
                      $PSNativeCommandUseErrorActionPreference = $false
                  }

                  gh release view $tagName --repo $env:GITHUB_REPOSITORY *> $null

                  if ($LASTEXITCODE -eq 0) {
                      throw "GitHub release already exists for $tagName"
                  }

                  & gh release create $tagName $zipPath `
                      --repo $env:GITHUB_REPOSITORY `
                      --target $env:GITHUB_SHA `
                      --title "MapPaste $tagName" `
                      --notes-file release-notes.md

                  if ($LASTEXITCODE -ne 0) {
                      throw "gh release create failed for $tagName"
                  }
